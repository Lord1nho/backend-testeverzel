services:
  - type: web
    name: backend-testeverzel
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TICKET_QR_SECRET
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3
      - key: TMDB_LANGUAGE
        value: pt-BR
      - key: TMDB_REGION
        value: BR
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
